[package]
name = "ferrum-desktop"
version = "0.1.0"
description = "Ferrum desktop shell (Tauri, Phase 5 FR4)"
authors = ["Plasma Comp"]
license = "MIT OR Apache-2.0"
edition = "2021"
rust-version = "1.77.2"

# Standalone workspace: keeps the heavy Tauri/webview dependency tree out of the
# main library workspace so its CI (clippy/test matrix) stays lean and fast.
[workspace]

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3" }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.3" }
tauri-plugin-log = "2"
tokio = { version = "1", features = ["sync"] }
# The shared client core (Phase 5 facade) with the `data-plane` runner enabled:
# `connect` opens a TUN and drives `run_mesh_session`, so the GUI moves packets.
ferrum-client-core = { path = "../../../crates/client-core", features = ["data-plane"] }
# The mesh transports (`UdpMeshTransport`, plus `QuicMeshTransport` /
# `MasqueMeshTransport` behind the `masque` feature, which pulls in `quic`) and the
# TUN device / key helpers the shell wires together when bringing up the data plane.
ferrum-transport = { path = "../../../crates/transport", features = ["masque"] }
ferrum-tunnel = { path = "../../../crates/tunnel" }
ferrum-core = { path = "../../../crates/core" }

# The real OS TUN device pulls in the `tun` driver crate: `/dev/net/tun` (or the
# macOS utun) on Unix, the wintun adapter on Windows. Enabled on both so the
# desktop drives a real data plane on either; `device::open` requires elevation
# (and on Windows a loadable `wintun.dll`).
[target.'cfg(unix)'.dependencies]
ferrum-tunnel = { path = "../../../crates/tunnel", features = ["real-tun"] }

# The kill-switch (FR5) enforces its leak-block via the Windows Filtering Platform
# on Windows (see src/killswitch.rs `wfp`). Version pinned to the one already in the
# tree (pulled transitively by Tauri) so the resolver doesn't add a second copy.
# `ferrum-tunnel/real-tun` here gives the wintun-backed data plane on Windows.
[target.'cfg(windows)'.dependencies]
ferrum-tunnel = { path = "../../../crates/tunnel", features = ["real-tun"] }
windows = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_Rpc",
    "Win32_NetworkManagement_Ndis",
    "Win32_NetworkManagement_IpHelper",
    "Win32_NetworkManagement_WindowsFilteringPlatform",
] }
