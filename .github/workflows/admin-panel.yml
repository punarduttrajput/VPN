name: Admin panel

# The coordinator's web admin panel (apps/admin-panel, Angular): its unit
# tests and production build, then the coordinator's `admin-api` feature,
# which embeds that build. Only runs when the panel or the admin API changes.
on:
  pull_request:
    paths:
      - "apps/admin-panel/**"
      - "crates/coordinator/src/admin.rs"
      - ".github/workflows/admin-panel.yml"
  push:
    branches: [main]
    paths:
      - "apps/admin-panel/**"
      - "crates/coordinator/src/admin.rs"
      - ".github/workflows/admin-panel.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: admin-panel-${{ github.ref }}
  cancel-in-progress: true

jobs:
  admin-panel:
    name: admin panel (ng test, ng build, coordinator admin-api)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: apps/admin-panel/package-lock.json

      - name: npm ci
        working-directory: apps/admin-panel
        run: npm ci

      - name: ng test
        working-directory: apps/admin-panel
        run: npx ng test --watch=false --browsers=ChromeHeadlessCI

      - name: ng build
        working-directory: apps/admin-panel
        run: npx ng build

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2

      # The admin-api feature embeds dist/admin-panel/browser/ (built above).
      - name: cargo test (coordinator admin-api)
        run: cargo test -p ferrum-coordinator --features admin-api

      - name: cargo clippy (coordinator admin-api)
        run: cargo clippy -p ferrum-coordinator --all-targets --features admin-api -- -D warnings
