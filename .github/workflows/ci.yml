name: CI

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      test_quic:
        description: "Also run QUIC end-to-end verification over a real TUN"
        type: boolean
        default: false

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  # Unit + integration tests on every push, across Linux and Windows (the dev host)./
  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      # Formatting + lint gate (run once, on Linux).
      - name: rustfmt
        if: matrix.os == 'ubuntu-latest'
        run: cargo fmt --all -- --check

      - name: clippy
        if: matrix.os == 'ubuntu-latest'
        run: cargo clippy --all-targets -- -D warnings

      - name: Build
        run: cargo build --workspace --all-targets

      - name: Test
        run: cargo test --workspace

      # Phase 2: exercise the QUIC transport (datagram roundtrip etc.).
      - name: Test (quic feature)
        run: cargo test --workspace --features ferrum-cli/quic

      - name: clippy (quic feature)
        if: matrix.os == 'ubuntu-latest'
        run: cargo clippy --workspace --all-targets --features ferrum-cli/quic -- -D warnings

      # Phase 2: exercise the MASQUE/HTTP3 transport (CONNECT-UDP roundtrip).
      - name: Test (masque feature)
        run: cargo test --workspace --features ferrum-cli/masque

      - name: clippy (masque feature)
        if: matrix.os == 'ubuntu-latest'
        run: cargo clippy --workspace --all-targets --features ferrum-cli/masque -- -D warnings

      # Phase 3: exercise the SQLite-backed coordinator persistence.
      - name: Test (coordinator sqlite feature)
        run: cargo test -p ferrum-coordinator --features sqlite

      - name: clippy (coordinator sqlite feature)
        if: matrix.os == 'ubuntu-latest'
        run: cargo clippy -p ferrum-coordinator --all-targets --features sqlite -- -D warnings

      # Phase 3: exercise mutual TLS on the coordinator gRPC channel.
      - name: Test (mtls feature)
        run: cargo test -p ferrum-client-core --features mtls

      - name: clippy (mtls feature)
        if: matrix.os == 'ubuntu-latest'
        run: cargo clippy -p ferrum-coordinator -p ferrum-client-core --all-targets --features ferrum-coordinator/mtls,ferrum-client-core/mtls -- -D warnings

      # Phase 3 FR2: exercise OIDC bearer-token authentication on the coordinator.
      - name: Test (coordinator oidc feature)
        run: cargo test -p ferrum-coordinator --features oidc

      - name: clippy (coordinator oidc feature)
        if: matrix.os == 'ubuntu-latest'
        run: cargo clippy -p ferrum-coordinator --all-targets --features oidc -- -D warnings

      # Phase 6 FR4: exercise the OTLP span-export wiring on the coordinator + CLI
      # (compiles the OpenTelemetry exporter stack; export itself needs a collector).
      - name: Test (otlp feature)
        run: cargo test -p ferrum-coordinator -p ferrum-cli --features ferrum-coordinator/otlp,ferrum-cli/otlp

      - name: clippy (otlp feature)
        if: matrix.os == 'ubuntu-latest'
        run: cargo clippy -p ferrum-coordinator -p ferrum-cli --all-targets --features ferrum-coordinator/otlp,ferrum-cli/otlp -- -D warnings

      # Phase 5: exercise the privileged-helper IPC (fd-passing, wire protocol,
      # firewall rule generation) — already unified into the base Build/Test
      # above via `ferrum-helper`'s unconditional Unix deps, but pinned here
      # explicitly so a manifest change can't silently drop the coverage.
      - name: Test (tunnel real-tun + helper-ipc features)
        run: cargo test -p ferrum-tunnel --features real-tun,helper-ipc

      - name: clippy (tunnel real-tun + helper-ipc features)
        if: matrix.os == 'ubuntu-latest'
        run: cargo clippy -p ferrum-tunnel --all-targets --features real-tun,helper-ipc -- -D warnings

  # Real-device + benchmark verification (M3 / M5 / M6) on a Linux runner.
  verify-linux:
    name: verify-linux (M3/M5/M6)
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Install network + benchmark tools
        run: sudo apt-get update && sudo apt-get install -y iproute2 iperf3

      - name: Ensure /dev/net/tun is available
        run: |
          sudo modprobe tun || true
          test -e /dev/net/tun && echo "TUN device present"

      - name: Run Phase 1 Linux verification
        # Preserve PATH so the cargo installed for the runner user is found under sudo.
        run: sudo -E env "PATH=$PATH" bash ./scripts/verify-linux.sh

  # Phase 2: QUIC end-to-end over a real TUN. Manual only — runs from the
  # "Run workflow" button when the test_quic input is checked, so it never
  # affects the default-green push CI.
  verify-quic:
    name: verify-quic (QUIC e2e over real TUN)
    runs-on: ubuntu-latest
    needs: test
    # github.event.inputs.* is always a string, so compare to 'true' (the typed
    # `inputs` boolean is unreliable inside `if:`). Skipped on normal pushes.
    if: ${{ github.event.inputs.test_quic == 'true' }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Install network + benchmark tools
        run: sudo apt-get update && sudo apt-get install -y iproute2 iperf3

      - name: Ensure /dev/net/tun is available
        run: sudo modprobe tun || true

      - name: Run verification with QUIC end-to-end
        run: sudo -E env "PATH=$PATH" TEST_QUIC=1 bash ./scripts/verify-linux.sh

  # Phase 6 FR4: validate the observability stack's Prometheus SLO rules and
  # Alertmanager config, and run the promtool alert-rule unit tests.
  observability:
    name: observability (SLO rules)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Lint Prometheus rules
        run: |
          docker run --rm --entrypoint promtool \
            -v "$PWD/deploy/observability":/work prom/prometheus:v2.54.1 \
            check rules /work/prometheus/rules/slo_recording.yml /work/prometheus/rules/slo_alerts.yml

      - name: Run promtool alert-rule unit tests
        run: |
          docker run --rm --entrypoint promtool \
            -v "$PWD/deploy/observability":/work prom/prometheus:v2.54.1 \
            test rules /work/prometheus/tests/slo_tests.yml

      - name: Check Alertmanager config
        run: |
          docker run --rm --entrypoint amtool \
            -v "$PWD/deploy/observability":/work prom/alertmanager:v0.27.0 \
            check-config /work/alertmanager/alertmanager.yml

  # SEC-008: every vendored/prebuilt binary must match its pinned SHA-256 (and
  # its upstream signature, where one exists) — a mismatch fails the build.
  vendored-binaries:
    name: vendored binaries (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Verify pinned digests (vendor/SHA256SUMS)
        shell: bash
        run: bash scripts/verify-vendored.sh

      - name: Verify wintun Authenticode signatures
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          foreach ($arch in 'amd64', 'arm64') {
            $sig = Get-AuthenticodeSignature "vendor/wintun/$arch/wintun.dll"
            $subject = $sig.SignerCertificate.Subject
            Write-Host "$arch : $($sig.Status) : $subject"
            if ($sig.Status -ne 'Valid' -or $subject -notlike 'CN=WireGuard LLC, O=WireGuard LLC,*') {
              throw "vendor/wintun/$arch/wintun.dll is not validly signed by WireGuard LLC"
            }
          }

      # Exercises the pinned download + verify-before-extract path and proves
      # the pin still matches the published release asset.
      - name: Install bpf-linker via the pinned script
        if: matrix.os == 'ubuntu-latest'
        run: |
          bash scripts/install-bpf-linker.sh --dest "$RUNNER_TEMP/bpf-linker"
          "$RUNNER_TEMP/bpf-linker/bpf-linker" --version
