name: CI

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      test_quic:
        description: "Also run QUIC end-to-end verification over a real TUN"
        type: boolean
        default: false

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  # Unit + integration tests on every push, across Linux and Windows (the dev host).
  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      # Formatting + lint gate (run once, on Linux).
      - name: rustfmt
        if: matrix.os == 'ubuntu-latest'
        run: cargo fmt --all -- --check

      - name: clippy
        if: matrix.os == 'ubuntu-latest'
        run: cargo clippy --all-targets -- -D warnings

      - name: Build
        run: cargo build --workspace --all-targets

      - name: Test
        run: cargo test --workspace

      # Phase 2: exercise the QUIC transport (datagram roundtrip etc.).
      - name: Test (quic feature)
        run: cargo test --workspace --features vpn-cli/quic

      - name: clippy (quic feature)
        if: matrix.os == 'ubuntu-latest'
        run: cargo clippy --workspace --all-targets --features vpn-cli/quic -- -D warnings

      # Phase 2: exercise the MASQUE/HTTP3 transport (CONNECT-UDP roundtrip).
      - name: Test (masque feature)
        run: cargo test --workspace --features vpn-cli/masque

      - name: clippy (masque feature)
        if: matrix.os == 'ubuntu-latest'
        run: cargo clippy --workspace --all-targets --features vpn-cli/masque -- -D warnings

      # Phase 3: exercise the SQLite-backed coordinator persistence.
      - name: Test (coordinator sqlite feature)
        run: cargo test -p vpn-coordinator --features sqlite

      - name: clippy (coordinator sqlite feature)
        if: matrix.os == 'ubuntu-latest'
        run: cargo clippy -p vpn-coordinator --all-targets --features sqlite -- -D warnings

  # Real-device + benchmark verification (M3 / M5 / M6) on a Linux runner.
  verify-linux:
    name: verify-linux (M3/M5/M6)
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Install network + benchmark tools
        run: sudo apt-get update && sudo apt-get install -y iproute2 iperf3

      - name: Ensure /dev/net/tun is available
        run: |
          sudo modprobe tun || true
          test -e /dev/net/tun && echo "TUN device present"

      - name: Run Phase 1 Linux verification
        # Preserve PATH so the cargo installed for the runner user is found under sudo.
        run: sudo -E env "PATH=$PATH" bash ./scripts/verify-linux.sh

  # Phase 2: QUIC end-to-end over a real TUN. Manual only — runs from the
  # "Run workflow" button when the test_quic input is checked, so it never
  # affects the default-green push CI.
  verify-quic:
    name: verify-quic (QUIC e2e over real TUN)
    runs-on: ubuntu-latest
    needs: test
    # github.event.inputs.* is always a string, so compare to 'true' (the typed
    # `inputs` boolean is unreliable inside `if:`). Skipped on normal pushes.
    if: ${{ github.event.inputs.test_quic == 'true' }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Install network + benchmark tools
        run: sudo apt-get update && sudo apt-get install -y iproute2 iperf3

      - name: Ensure /dev/net/tun is available
        run: sudo modprobe tun || true

      - name: Run verification with QUIC end-to-end
        run: sudo -E env "PATH=$PATH" TEST_QUIC=1 bash ./scripts/verify-linux.sh
