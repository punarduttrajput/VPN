name: Supply chain

# SEC-017: cargo-deny over the root workspace (deny.toml, all features since
# SEC-022): RustSec advisories (vulnerable, unsound, unmaintained, yanked),
# licences, bans and sources. SEC-022 adds the desktop app, a separate
# workspace checked the same way with its own apps/desktop/src-tauri/deny.toml.
# Runs on every push/PR, and daily, so a newly published advisory against a
# dependency we already ship is caught without waiting for a code change.

on:
  # Minutes are billed on this private repo (and Windows at 2x), so: run on
  # PRs and on pushes to main only (not every branch push, which ran
  # everything twice per PR commit), and skip docs-only changes.
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "PRD/**"
      - "tickets/**"
  pull_request:
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "PRD/**"
      - "tickets/**"
  schedule:
    - cron: "41 4 * * *"
  workflow_dispatch:

# A newer push to the same PR cancels its still-running run. Everything else
# (main pushes, schedules, manual runs) is grouped by commit, so no main
# commit's run is ever cancelled or replaced while pending.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  cargo-deny:
    name: cargo-deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Pinned to a commit (v2.1.1), not a movable tag (the SEC-008 principle
      # applied to CI: third-party code that gates the build is pinned).
      - name: cargo deny check
        uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check all

      - name: cargo deny check (desktop app)
        uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          manifest-path: apps/desktop/src-tauri/Cargo.toml
          command: check all
