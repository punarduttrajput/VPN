name: Supply chain

# SEC-017: cargo-deny over the root workspace (deny.toml): RustSec advisories
# (vulnerable, unsound, unmaintained, yanked), licences, bans and sources. Runs
# on every push/PR, and daily, so a newly published advisory against a
# dependency we already ship is caught without waiting for a code change.

on:
  push:
  pull_request:
  schedule:
    - cron: "41 4 * * *"
  workflow_dispatch:

jobs:
  cargo-deny:
    name: cargo-deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Pinned to a commit (v2.1.1), not a movable tag (the SEC-008 principle
      # applied to CI: third-party code that gates the build is pinned).
      - name: cargo deny check
        uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check all
