syntax = "proto3";

package ferrum.coordinator.v1;

// The control-plane coordinator (PRD Phase 3, FR1/FR3).
// Devices register their public key + reachable endpoint and receive a tunnel
// IP; they then fetch the network map of peers they are permitted to reach.
// Carries only control metadata — never user traffic (NFR4 privacy).
service Coordinator {
  // Register (or re-register) a device; returns its assigned tunnel address.
  rpc RegisterDevice(RegisterDeviceRequest) returns (RegisterDeviceResponse);
  // Return the set of peers this device may currently reach.
  rpc GetNetworkMap(NetworkMapRequest) returns (NetworkMapResponse);
  // Stream the network map: the current map immediately, then a fresh map
  // whenever the network changes (a device registers / updates / publishes
  // candidates).
  rpc WatchNetworkMap(NetworkMapRequest) returns (stream NetworkMapResponse);
  // Publish this device's ICE candidates (host + STUN server-reflexive
  // ip:port strings) for NAT traversal (PRD Phase 4 FR1/FR5). Candidates are
  // distributed to permitted peers via the network map; republishing replaces
  // the set and pushes a fresh map to watchers.
  rpc PublishCandidates(PublishCandidatesRequest) returns (PublishCandidatesResponse);
  // Announce a relay to the coordinator and keep it alive (PRD Phase 6,
  // phase-6-anycast-autoscaling.md FR3 — dynamic relay advertisement). A relay
  // heartbeats periodically; the coordinator advertises a live relay in the
  // network map (unless a static `--relay` override is configured) and
  // withdraws one that misses its heartbeats or says it is draining. Watchers
  // are pushed a fresh map whenever the advertised relay changes.
  rpc RelayHeartbeat(RelayHeartbeatRequest) returns (RelayHeartbeatResponse);
  // Rotate a device's static public key (PRD Phase 3, FR3 — key rotation).
  // The device keeps its identity in the network: its assigned tunnel IP, name,
  // endpoint, tags, and candidates are preserved; only the public key changes.
  // The coordinator pushes a fresh map to watchers so peers re-handshake to the
  // new key. Carries no private key — the device generates its new keypair
  // locally and sends only the new public key.
  rpc RotateKey(RotateKeyRequest) returns (RotateKeyResponse);
}

message RegisterDeviceRequest {
  string public_key = 1;      // base64 Curve25519 public key
  string name = 2;            // human-friendly device label
  string endpoint = 3;        // reachable UDP endpoint "ip:port" (may be empty)
  repeated string tags = 4;   // device tags for ACL/policy matching
  // The TLS pin of this device (SEC-004): SHA-256 (64 lowercase hex) of the
  // SubjectPublicKeyInfo — the *public key*, not the whole certificate — that
  // it presents when peers dial it over QUIC, or empty when it isn't
  // reachable over a TLS transport. Distributed to permitted peers in the
  // network map so they can pin it. Replaced on every registration. (The
  // field name predates the switch to key pins; the wire name is kept.)
  string tls_cert_sha256 = 5;
}

message RegisterDeviceResponse {
  string assigned_cidr = 1; // tunnel address, e.g. "10.8.0.2/32"
}

message NetworkMapRequest {
  string public_key = 1; // the requesting device
}

message PeerInfo {
  string public_key = 1;
  string endpoint = 2;            // "ip:port"
  repeated string allowed_ips = 3; // CIDRs routed to this peer
  repeated string candidates = 4;  // ICE candidates (host + reflexive "ip:port")
  // The peer's registered TLS pin (public-key hash; see RegisterDeviceRequest),
  // or empty. A dialer over QUIC accepts only a certificate with this key.
  string tls_cert_sha256 = 5;
}

message NetworkMapResponse {
  repeated PeerInfo peers = 1;
  // Network-wide DERP-style relay fallback advertised by the coordinator
  // ("ip:port"), or empty if none. A node uses it as the relay underlay for
  // NAT traversal (PRD Phase 4) unless it has a local override configured.
  string relay = 2;
  // DNS resolvers advertised by the coordinator (bare IPs, reachable through
  // the tunnel), or empty if none. A node points its system DNS at these
  // while connected (PRD leak-protection.md) unless it has a local `[dns]`
  // override configured — the same local-else-advertised order as `relay`.
  repeated string dns_servers = 3;
}

message PublishCandidatesRequest {
  string public_key = 1;          // the publishing device
  repeated string candidates = 2; // ICE candidate "ip:port" strings
}

message PublishCandidatesResponse {}

message RelayHeartbeatRequest {
  string addr = 1;   // the relay's client-reachable UDP listener, "ip:port"
  bool draining = 2; // goodbye: withdraw this relay from advertisement now
}

message RelayHeartbeatResponse {
  // Send the next heartbeat within this many seconds; a relay silent for a
  // few multiples of this is withdrawn from advertisement.
  uint32 interval_secs = 1;
}

message RotateKeyRequest {
  string old_public_key = 1; // the device's current public key
  string new_public_key = 2; // the freshly generated public key to switch to
  // The TLS pin that goes with the new key (a device's TLS key is derived
  // from its WireGuard key, so it changes too), or empty to clear the pin.
  string new_tls_cert_sha256 = 3;
}

message RotateKeyResponse {
  string assigned_cidr = 1; // the (unchanged) tunnel address, echoed back
}
