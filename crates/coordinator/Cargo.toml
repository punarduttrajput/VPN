[package]
name = "ferrum-coordinator"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
# Internal workspace crate, never published (lets cargo-deny accept its path
# dependencies; SEC-017).
publish = false

[[bin]]
name = "ferrum-coordinator"
path = "src/main.rs"

[features]
default = []
# Durable device persistence via bundled SQLite (no system library needed).
sqlite = ["dep:rusqlite", "dep:serde_json"]
# Mutual TLS on the gRPC channel (tonic rustls + rcgen test PKI). `ring` gives
# the client-certificate fingerprint used for identity->key binding (SEC-002).
mtls = ["tonic/tls", "dep:rcgen", "dep:rustls", "dep:ring"]
# OIDC bearer-token authentication: verify JWTs (RS256/ES256) against a JWKS so
# device tags become a verified authorization boundary. Offline verification via
# the vetted `jsonwebtoken` crate on its pure-Rust backend (SEC-014); no external
# IdP is needed to test.
oidc = ["dep:jsonwebtoken", "dep:serde_json"]
# OpenTelemetry span export (PRD Phase 6 FR4): export the existing RPC-handler
# tracing spans to an OTLP collector (gRPC, default :4317) via --otlp-endpoint.
# The spans use skip_all already (NFR5), so this exports aggregate timing only.
otlp = [
    "dep:opentelemetry",
    "dep:opentelemetry_sdk",
    "dep:opentelemetry-otlp",
    "dep:tracing-opentelemetry",
]
# Admin HTTP API + static panel (device list/revoke, live ACL policy view/edit).
# Implies `oidc`: the admin surface has no other auth mode — it reuses the same
# OidcVerifier, gated on an "admin" tag/claim, and fails closed with no verifier.
# The panel itself is an Angular app (apps/admin-panel/) whose `ng build` output
# is embedded at compile time via `rust-embed` — run that build before
# `cargo build --features admin-api` (see apps/admin-panel/README.md).
admin-api = ["oidc", "dep:axum", "dep:rust-embed"]

[dependencies]
ferrum-control-proto = { path = "../control-proto" }
# Only for the shared TLS-pin parser (`ferrum_transport::fingerprint`, SEC-004);
# the default feature set pulls in no QUIC/TLS stack.
ferrum-transport = { path = "../transport" }
tonic.workspace = true
prost.workspace = true
tokio.workspace = true
thiserror.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
serde.workspace = true
toml.workspace = true
tokio-stream = "0.1"
rusqlite = { version = "0.32", features = ["bundled"], optional = true }
serde_json = { version = "1", optional = true }
rcgen = { workspace = true, optional = true }
rustls = { workspace = true, optional = true }
ring = { version = "0.17", optional = true }
# SEC-014: replaces the hand-rolled JWT verifier. Pinned to 9.x, the last major
# with a `ring` backend (the crypto library already in the tree): 10+/11 need
# either aws-lc-rs or a rust_crypto backend whose ed25519-dalek -> curve25519-dalek
# 4.1 can't coexist with boringtun 0.6's exact x25519-dalek =2.0.0-rc.3 pin.
# Move to 11.x (rust_crypto) together with a boringtun 0.7 upgrade.
jsonwebtoken = { version = "9.3", default-features = false, optional = true }
opentelemetry = { workspace = true, optional = true }
opentelemetry_sdk = { workspace = true, optional = true }
opentelemetry-otlp = { workspace = true, optional = true }
tracing-opentelemetry = { workspace = true, optional = true }
axum = { version = "0.7", optional = true }
rust-embed = { version = "8", optional = true, features = ["mime-guess"] }

[dev-dependencies]
# The OIDC tests mint their own ES256 tokens (auth::testsign).
ring = "0.17"
base64 = { workspace = true }
tokio-stream = { version = "0.1", features = ["net"] }
tower = { version = "0.5", features = ["util"] }
