[package]
name = "ferrum-tunnel"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[features]
default = []
# Pulls in the real OS TUN device (Linux/macOS). Off by default so the data
# plane builds and tests on any host (incl. Windows) without platform drivers.
real-tun = ["dep:tun"]
# Forwarded to ferrum-transport so a tunnel build can include the QUIC transport.
quic = ["ferrum-transport/quic"]
# Forwarded to ferrum-transport for the MASQUE / HTTP3 transport.
masque = ["ferrum-transport/masque"]
# The privileged-helper IPC client/server wire protocol (Phase 5): a
# `UnixStream`-based request/response protocol for handing a TUN fd (and
# firewall commands) between an unprivileged GUI and a root helper daemon.
# Independent of `real-tun` — the client side needs no TUN driver at all.
helper-ipc = ["dep:serde", "dep:serde_json"]

[dependencies]
ferrum-core = { path = "../core" }
ferrum-transport = { path = "../transport" }
boringtun.workspace = true
x25519-dalek.workspace = true
tokio.workspace = true
tracing.workspace = true
thiserror.workspace = true
# Real TUN device — only compiled when the `real-tun` feature is enabled,
# which is intended for Unix (Phase 1 scope: Linux + macOS).
tun = { version = "0.6", features = ["async"], optional = true }
# The helper IPC wire format (`helper-ipc` feature only).
serde = { workspace = true, optional = true }
serde_json = { version = "1", optional = true }

# fd I/O for `device::from_fd` (a platform-provided TUN fd, Phase 5) and
# `fdpass`/`helper_proto` (Phase 5 privileged helper). Unix only; needs no
# driver, so it's not behind `real-tun`. SEC-016: rustix's safe, typed wrappers
# replaced the hand-rolled libc FFI (rustix is already in the tree).
[target.'cfg(unix)'.dependencies]
rustix = { version = "1.1", features = ["net"] }

[dev-dependencies]
ferrum-transport = { path = "../transport" }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "io-util"] }
