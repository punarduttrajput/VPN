[package]
name = "ferrum-client-core"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[lib]
# `cdylib` so `uniffi-bindgen --library` can read the FFI metadata from the
# built dynamic library; `lib` so the rest of the workspace links it normally.
crate-type = ["lib", "cdylib"]

[features]
default = []
# Mutual TLS for the coordinator channel (tonic rustls).
mtls = ["tonic/tls", "dep:rustls"]
# FFI bindings (Phase 5 FR1): annotate the facade for uniffi and expose the
# `FfiFerrumClient` Object so Swift/Kotlin can be generated. Off by default so the
# regular build stays lean.
uniffi = ["dep:uniffi"]
# Data-plane glue (Phase 5): a `FerrumClient`-driven mesh runner that ties the
# control facade to `ferrum-tunnel::run_mesh`. Pulls in the tunnel/transport/core
# crates, so it's opt-in — control-plane-only consumers stay lean.
data-plane = ["dep:ferrum-tunnel", "dep:ferrum-transport", "dep:ferrum-core"]

[dependencies]
ferrum-control-proto = { path = "../control-proto" }
tonic.workspace = true
tokio.workspace = true
thiserror.workspace = true
tracing.workspace = true
rustls = { workspace = true, optional = true }
uniffi = { version = "0.31", features = ["tokio", "cli"], optional = true }
ferrum-tunnel = { path = "../tunnel", optional = true }
ferrum-transport = { path = "../transport", optional = true }
ferrum-core = { path = "../core", optional = true }

[dev-dependencies]
ferrum-coordinator = { path = "../coordinator", features = ["mtls"] }
tokio-stream = { version = "0.1", features = ["net"] }

# Generate foreign-language bindings:
#   cargo run -p ferrum-client-core --features uniffi --bin uniffi-bindgen -- \
#       generate --library target/debug/<lib> --language swift  --out-dir bindings/swift
[[bin]]
name = "uniffi-bindgen"
required-features = ["uniffi"]
