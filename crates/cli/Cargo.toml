[package]
name = "ferrum-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

# Full name and a short `fe` alias — both build from the same entrypoint.
[[bin]]
name = "ferrum"
path = "src/main.rs"

[[bin]]
name = "fe"
path = "src/main.rs"

[features]
default = []
# Build the CLI with QUIC transport available (forwarded to ferrum-tunnel).
quic = ["ferrum-tunnel/quic"]
# Build with the MASQUE / HTTP3 transport available.
masque = ["ferrum-tunnel/masque"]
# Export the relay's tracing spans to an OTLP collector (PRD Phase 6 FR4) via
# `ferrum relay --otlp-endpoint <url>`. Optional so default builds stay lean.
otlp = [
    "dep:opentelemetry",
    "dep:opentelemetry_sdk",
    "dep:opentelemetry-otlp",
    "dep:tracing-opentelemetry",
]
# The relay's eBPF/XDP fast path (PRD `phase-6-ebpf-xdp-relay.md`) via
# `ferrum relay --xdp-iface <name> --xdp-program <path>`. Forwarded straight
# to `ferrum-transport`, whose `aya`/`aya-log` deps are themselves Linux-only
# target dependencies — so this is a no-op everywhere except a Linux build
# that explicitly requests it.
xdp = ["ferrum-transport/xdp"]

[dependencies]
ferrum-core = { path = "../core" }
ferrum-tunnel = { path = "../tunnel" }
ferrum-transport = { path = "../transport" }
ferrum-client-core = { path = "../client-core", features = ["data-plane"] }
clap.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
anyhow.workspace = true
opentelemetry = { workspace = true, optional = true }
opentelemetry_sdk = { workspace = true, optional = true }
opentelemetry-otlp = { workspace = true, optional = true }
tracing-opentelemetry = { workspace = true, optional = true }
