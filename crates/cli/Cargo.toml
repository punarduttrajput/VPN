[package]
name = "ferrum-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

# Full name and a short `fe` alias — both build from the same entrypoint.
[[bin]]
name = "ferrum"
path = "src/main.rs"

[[bin]]
name = "fe"
path = "src/main.rs"

[features]
default = []
# Build the CLI with QUIC transport available (forwarded to ferrum-tunnel).
quic = ["ferrum-tunnel/quic"]
# Build with the MASQUE / HTTP3 transport available.
masque = ["ferrum-tunnel/masque"]

[dependencies]
ferrum-core = { path = "../core" }
ferrum-tunnel = { path = "../tunnel" }
ferrum-transport = { path = "../transport" }
ferrum-client-core = { path = "../client-core", features = ["data-plane"] }
clap.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
anyhow.workspace = true
