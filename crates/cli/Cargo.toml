[package]
name = "vpn-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[[bin]]
name = "vpn"
path = "src/main.rs"

[features]
default = []
# Build the CLI with QUIC transport available (forwarded to vpn-tunnel).
quic = ["vpn-tunnel/quic"]
# Build with the MASQUE / HTTP3 transport available.
masque = ["vpn-tunnel/masque"]

[dependencies]
vpn-core = { path = "../core" }
vpn-tunnel = { path = "../tunnel" }
vpn-transport = { path = "../transport" }
clap.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
anyhow.workspace = true
