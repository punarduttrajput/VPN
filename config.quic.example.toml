# Example QUIC-transport config (PRD Phase 2, FR2/FR6).
# Build with the quic feature:  cargo build --features ferrum-cli/quic
# One peer must be role = "server" (accepts), the other role = "client" (connects).
#
# This peer is 10.8.0.1 acting as the QUIC client; the remote (10.8.0.2) is the
# QUIC server listening on its endpoint. Swap roles/keys on the other peer.

private_key = "QS7buCcJSPaBxgL+RBprA3Jd/4HhbqljS1WPEWad4Yg="
listen_port = 51820
interface_address = "10.8.0.1/24"

[peer]
public_key = "KHyJB+k340kMHCKZfdFOY0ZWRYn7Sab16haK1Yk+WW8="
endpoint = "203.0.113.5:51820"
allowed_ips = ["10.8.0.2/32"]

[transport]
mode = "quic"
role = "client"        # the other peer uses role = "server"
server_name = "ferrum"    # TLS SNI presented/expected (peer identity is via WireGuard)
# Optional DERP-style relay fallback for `ferrum up-mesh` (Phase 4 NAT traversal).
# Independent of `mode`: when set, the mesh runs the direct transport AND a
# public-key-keyed relay at once, preferring direct and falling back per peer.
# Run a relay with `ferrum relay --listen <addr>`.
# relay = "203.0.113.9:3478"
