# promtool unit tests for the Ferrum SLO/alert rules (PRD Phase 6 FR4).
#
# Run:  promtool test rules deploy/observability/prometheus/tests/slo_tests.yml
# (also runs in the one-off container during stack verification — see README).
#
# These deterministically prove each alert fires on the condition it's meant to
# (and stays silent when healthy) without waiting for real `for` windows.

rule_files:
  - ../rules/slo_recording.yml
  - ../rules/slo_alerts.yml

evaluation_interval: 1m

tests:
  # --- A coordinator outage pages immediately, then burns the availability SLO.
  - name: coordinator outage
    interval: 1m
    input_series:
      - series: 'up{job="ferrum-coordinator", instance="c1"}'
        values: '0+0x70'
      - series: 'up{job="ferrum-relay", instance="r1"}'
        values: '1+0x70'
    alert_rule_test:
      - eval_time: 5m
        alertname: FerrumCoordinatorDown
        exp_alerts:
          - exp_labels:
              severity: critical
              job: ferrum-coordinator
              instance: c1
            exp_annotations:
              summary: "Coordinator target down"
              description: "Prometheus has not scraped c1 (ferrum-coordinator) for >2m."
      - eval_time: 65m
        alertname: FerrumAvailabilityFastBurn
        exp_alerts:
          - exp_labels:
              severity: critical
              slo: availability
              job: ferrum-coordinator
            exp_annotations:
              summary: "ferrum-coordinator is burning its availability budget fast (page)"
              description: "ferrum-coordinator unavailability is 100% over 1h & 5m — >14.4x the 99.95% error budget. At this rate the 30d budget is exhausted in ~2 days."

  # --- The relay dropping ~50% of frames trips the forwarding fast-burn page.
  - name: relay dropping frames
    interval: 1m
    input_series:
      - series: 'up{job="ferrum-coordinator", instance="c1"}'
        values: '1+0x70'
      - series: 'up{job="ferrum-relay", instance="r1"}'
        values: '1+0x70'
      - series: 'ferrum_relay_frames_forwarded_total{instance="r1"}'
        values: '0+30x70'
      - series: 'ferrum_relay_frames_dropped_total{instance="r1"}'
        values: '0+30x70'
    alert_rule_test:
      - eval_time: 65m
        alertname: FerrumRelayForwardFastBurn
        exp_alerts:
          - exp_labels:
              severity: critical
              slo: relay-forwarding
            exp_annotations:
              summary: "Relay is dropping frames fast (page)"
              description: "Relay frame-drop ratio is 50% over 1h & 5m — >14.4x the 99% forwarding-success budget."

  # --- The coordinator serving every RPC slower than 100ms trips the latency
  #     fast-burn page (le="0.1" bucket flat while the total count climbs).
  - name: coordinator latency slow
    interval: 1m
    input_series:
      - series: 'up{job="ferrum-coordinator", instance="c1"}'
        values: '1+0x70'
      - series: 'ferrum_request_duration_seconds_bucket{le="0.1", instance="c1"}'
        values: '0+0x70'
      - series: 'ferrum_request_duration_seconds_count{instance="c1"}'
        values: '0+60x70'
    alert_rule_test:
      - eval_time: 65m
        alertname: FerrumCoordinatorLatencyFastBurn
        exp_alerts:
          - exp_labels:
              severity: critical
              slo: coordinator-latency
            exp_annotations:
              summary: "Coordinator latency budget burning fast (page)"
              description: "Share of RPCs slower than 100ms is 100% over 1h & 5m — >14.4x the 99%-under-100ms budget."

  # --- A healthy steady state fires none of the burn-rate / down alerts.
  - name: healthy steady state
    interval: 1m
    input_series:
      - series: 'up{job="ferrum-coordinator", instance="c1"}'
        values: '1+0x70'
      - series: 'up{job="ferrum-relay", instance="r1"}'
        values: '1+0x70'
      - series: 'ferrum_relay_frames_forwarded_total{instance="r1"}'
        values: '0+100x70'
      - series: 'ferrum_relay_frames_dropped_total{instance="r1"}'
        values: '0+0x70'
      # Every RPC completes under 100ms: the le="0.1" bucket tracks the count.
      - series: 'ferrum_request_duration_seconds_bucket{le="0.1", instance="c1"}'
        values: '0+60x70'
      - series: 'ferrum_request_duration_seconds_count{instance="c1"}'
        values: '0+60x70'
    alert_rule_test:
      - eval_time: 65m
        alertname: FerrumAvailabilityFastBurn
        exp_alerts: []
      - eval_time: 65m
        alertname: FerrumRelayForwardFastBurn
        exp_alerts: []
      - eval_time: 65m
        alertname: FerrumCoordinatorLatencyFastBurn
        exp_alerts: []
      - eval_time: 5m
        alertname: FerrumCoordinatorDown
        exp_alerts: []

  # --- The tunnel-IP pool filling past 90% raises the capacity warning.
  - name: ip pool near exhaustion
    interval: 1m
    input_series:
      - series: 'ferrum_devices_registered{job="ferrum-coordinator", instance="c1"}'
        values: '230+0x15'
      - series: 'up{job="ferrum-coordinator", instance="c1"}'
        values: '1+0x15'
    alert_rule_test:
      - eval_time: 12m
        alertname: FerrumCoordinatorIPPoolNearExhaustion
        exp_alerts:
          - exp_labels:
              severity: warning
              job: ferrum-coordinator
              instance: c1
            exp_annotations:
              summary: "Coordinator tunnel-IP pool >90% full"
              description: "230 devices registered — approaching the /24 pool limit (~254). New devices will fail to get an address."
