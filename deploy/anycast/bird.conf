# bird2 config for one Ferrum relay PoP behind an anycast address
# (PRD phase-6-anycast-autoscaling.md FR5). See README.md in this directory.
#
# Every value marked CHANGE is a placeholder: the addresses are documentation
# ranges (RFC 5737 / RFC 3849) and the ASNs are private (RFC 6996). Check the
# result with `bird -p -c bird.conf` before loading it.

router id 198.51.100.10;                      # CHANGE: this PoP's unicast IPv4

log syslog all;

protocol device {
}

# The anycast prefixes. Both start disabled: `ferrum anycast-gate` enables them
# once the local relay answers /readyz, and disables them when it drains or
# stops answering. They are only ever exported to BGP, never to the kernel
# (there is no `protocol kernel` here): the relay address itself lives on the
# loopback. A /24 and a /48 are the smallest prefixes most networks accept.
protocol static ferrum_anycast4 {
    disabled yes;
    ipv4;
    route 192.0.2.0/24 blackhole;             # CHANGE: your anycast IPv4 prefix
}

protocol static ferrum_anycast6 {
    disabled yes;
    ipv6;
    route 2001:db8:f00::/48 blackhole;        # CHANGE: your anycast IPv6 prefix
}

# Announce only the anycast prefixes, and take nothing from the upstream.
filter ferrum_anycast_out {
    if proto = "ferrum_anycast4" || proto = "ferrum_anycast6" then accept;
    reject;
}

protocol bgp upstream4 {
    local 198.51.100.10 as 64512;             # CHANGE: unicast address, your ASN
    neighbor 198.51.100.1 as 64496;           # CHANGE: the provider's router and ASN
    ipv4 {
        import none;
        export filter ferrum_anycast_out;
    };
}

protocol bgp upstream6 {
    local 2001:db8:100::10 as 64512;          # CHANGE
    neighbor 2001:db8:100::1 as 64496;        # CHANGE
    ipv6 {
        import none;
        export filter ferrum_anycast_out;
    };
}
