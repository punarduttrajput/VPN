[workspace]
resolver = "2"
members = [
    "crates/core",
    "crates/tunnel",
    "crates/cli",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
authors = ["Plasma Comp"]

[workspace.dependencies]
# crypto / keys
# Pinned to match boringtun 0.6.0's exact dependency (=2.0.0-rc.3) so the
# StaticSecret/PublicKey types unify across crates.
x25519-dalek = { version = "=2.0.0-rc.3", features = ["getrandom", "static_secrets"] }
base64 = "0.22"
# wireguard data plane
boringtun = "0.6"
# async runtime
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "signal", "sync", "io-util"] }
# config / serde
serde = { version = "1", features = ["derive"] }
toml = "0.8"
# cli
clap = { version = "4", features = ["derive"] }
# errors
thiserror = "1"
anyhow = "1"
# logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
