[workspace]
resolver = "2"
members = [
    "crates/core",
    "crates/transport",
    "crates/tunnel",
    "crates/cli",
    "crates/control-proto",
    "crates/coordinator",
    "crates/client-core",
    "crates/helper",
    "crates/relay-xdp-common",
]
# The Tauri desktop shell is its own workspace (heavy webview deps); keep it out
# of the library workspace so this CI stays lean. See apps/desktop/.
# `relay-ebpf` is likewise its own standalone workspace (needs a
# bpfel-unknown-none target + nightly + bpf-linker most hosts building this
# repo don't have) — see PRD/phase-6-ebpf-xdp-relay.md.
exclude = ["apps/desktop/src-tauri", "relay-ebpf"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
authors = ["punar Rajput <punar@ferrum.dev>"]

[workspace.dependencies]
# crypto / keys
# Pinned to match boringtun 0.6.0's exact dependency (=2.0.0-rc.3) so the
# StaticSecret/PublicKey types unify across crates.
x25519-dalek = { version = "=2.0.0-rc.3", features = ["getrandom", "static_secrets"] }
base64 = "0.22"
# wireguard data plane
boringtun = "0.6"
# async runtime
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "signal", "sync", "io-util"] }
# config / serde
serde = { version = "1", features = ["derive"] }
toml = "0.8"
# cli
clap = { version = "4", features = ["derive"] }
# control plane (Phase 3): gRPC coordinator
tonic = "0.12"
prost = "0.13"
tonic-build = "0.12"
protoc-bin-vendored = "3"
# transport (Phase 2): QUIC over a pinned-ring rustls stack (avoids aws-lc-rs
# build deps on Windows). MASQUE/HTTP3 lands in a later Phase 2 increment.
quinn = { version = "0.11", default-features = false, features = ["runtime-tokio", "rustls-ring"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
rcgen = { version = "0.13", default-features = false, features = ["crypto", "ring", "pem"] }
bytes = "1"
# MASQUE / HTTP3 (Phase 2 FR3)
h3 = "0.0.8"
h3-quinn = { version = "0.0.10", features = ["datagram"] }
h3-datagram = "0.0.2"
http = "1"
# errors
thiserror = "1"
anyhow = "1"
# logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
# OpenTelemetry span export (Phase 6 FR4, `otlp` feature). Optional — pulled in
# only by the binaries' `otlp` feature so default builds stay lean. The OTLP
# exporter speaks gRPC to a collector (default :4317). Versions kept in lock-step
# (otel 0.32 / sdk 0.32 / otlp 0.32 / tracing-opentelemetry 0.33).
opentelemetry = "0.32"
opentelemetry_sdk = { version = "0.32", features = ["rt-tokio"] }
opentelemetry-otlp = { version = "0.32", default-features = false, features = ["grpc-tonic", "trace"] }
tracing-opentelemetry = "0.33"
# platform-specific (Linux sendmmsg / recvmmsg for UDP batching, NFR1)
libc = "0.2"
