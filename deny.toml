# cargo-deny configuration (SEC-017): dependency advisories, licences, bans and
# sources, checked in CI (`.github/workflows/supply-chain.yml`) for the root
# workspace. Run locally with `cargo deny check`.
#
# Every `ignore` below names the advisory, why it can't be fixed yet, and the
# ticket that removes it. Adding one without those three is a review blocker.

[graph]
# Every optional feature too (SEC-022): the QUIC/MASQUE transports, OIDC,
# admin API, uniffi bindings and the rest are optional, and checking only the
# default set let RUSTSEC-2026-0185 (quinn-proto) through unnoticed.
all-features = true

[advisories]
# Unmaintained crates and unsound code fail the check too, not just CVEs.
unmaintained = "all"
yanked = "deny"
ignore = [
    # rustls-pemfile is unmaintained (its function moved into
    # rustls-pki-types); not a vulnerability. It arrives via tonic 0.12's TLS
    # support and goes away with a tonic upgrade.
    { id = "RUSTSEC-2025-0134", reason = "unmaintained, not vulnerable; via tonic 0.12" },
]

[licenses]
# Permissive licences only. Anything else fails until reviewed and added here.
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-1-Clause",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "MIT",
    "Unicode-3.0",
    "Unlicense",
    "WTFPL",
    "Zlib",
]
confidence-threshold = 0.9

# MPL-2.0 is weak, file-level copyleft: using these crates unmodified puts no
# obligation on Ferrum's own code. Scoped to the uniffi crates that generate
# the Android/iOS bindings (client-core `uniffi` feature), not allowed globally.
[[licenses.exceptions]]
crate = "uniffi"
allow = ["MPL-2.0"]

[[licenses.exceptions]]
crate = "uniffi_bindgen"
allow = ["MPL-2.0"]

[[licenses.exceptions]]
crate = "uniffi_core"
allow = ["MPL-2.0"]

[[licenses.exceptions]]
crate = "uniffi_internal_macros"
allow = ["MPL-2.0"]

[[licenses.exceptions]]
crate = "uniffi_macros"
allow = ["MPL-2.0"]

[[licenses.exceptions]]
crate = "uniffi_meta"
allow = ["MPL-2.0"]

[[licenses.exceptions]]
crate = "uniffi_pipeline"
allow = ["MPL-2.0"]

[[licenses.exceptions]]
crate = "uniffi_udl"
allow = ["MPL-2.0"]

[bans]
# Duplicate versions are common transitively (windows-sys, socket2, ...) and not
# a security issue on their own, so they're reported, not failed.
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
# Only crates.io; a git or third-party registry dependency must be added here
# deliberately.
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
